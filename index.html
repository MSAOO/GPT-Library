<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f3efe6" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#141414" media="(prefers-color-scheme: dark)">
  <title>GPT電子書庫</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f3efe6;
      --surface: rgba(255,255,255,.78);
      --surface-strong: #ffffff;
      --text: #202020;
      --muted: #6e675d;
      --line: rgba(90,75,55,.16);
      --accent: #6d4c2f;
      --accent-soft: rgba(109,76,47,.10);
      --shadow: 0 10px 30px rgba(70,55,40,.10);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #141414;
        --surface: rgba(35,35,35,.88);
        --surface-strong: #242424;
        --text: #f1ede5;
        --muted: #b8b0a4;
        --line: rgba(255,255,255,.10);
        --accent: #d9b68c;
        --accent-soft: rgba(217,182,140,.12);
        --shadow: 0 12px 32px rgba(0,0,0,.28);
      }
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top right, var(--accent-soft), transparent 34rem),
        var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans",
        "Yu Gothic", "YuGothic", "Noto Sans JP", sans-serif;
      line-height: 1.75;
    }
    .wrap {
      width: min(100% - 32px, 860px);
      margin: 0 auto;
      padding: max(28px, env(safe-area-inset-top)) 0
               calc(44px + env(safe-area-inset-bottom));
    }
    header {
      padding: 18px 2px 26px;
    }
    .eyebrow {
      margin: 0 0 5px;
      color: var(--accent);
      font-size: .84rem;
      font-weight: 700;
      letter-spacing: .12em;
    }
    h1 {
      margin: 0;
      font-family: "Hiragino Mincho ProN", "Yu Mincho", "YuMincho", serif;
      font-size: clamp(2rem, 8vw, 3.4rem);
      line-height: 1.2;
      letter-spacing: .02em;
    }
    .lead {
      margin: 13px 0 0;
      max-width: 42rem;
      color: var(--muted);
      font-size: 1rem;
    }
    .section-title {
      margin: 24px 0 12px;
      font-size: 1.05rem;
      letter-spacing: .06em;
    }
    .book {
      display: block;
      position: relative;
      padding: 22px;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: var(--surface);
      box-shadow: var(--shadow);
      color: inherit;
      text-decoration: none;
      -webkit-tap-highlight-color: transparent;
      transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
      backdrop-filter: blur(14px);
    }
    .book:active { transform: scale(.985); }
    @media (hover: hover) {
      .book:hover {
        transform: translateY(-2px);
        border-color: var(--accent);
        box-shadow: 0 16px 38px rgba(70,55,40,.16);
      }
    }
    .book-top {
      display: grid;
      grid-template-columns: 64px minmax(0, 1fr) auto;
      align-items: center;
      gap: 16px;
    }
    .cover {
      display: grid;
      place-items: center;
      width: 64px;
      height: 84px;
      border-radius: 8px 13px 13px 8px;
      background: linear-gradient(145deg, #8a6546, #5e3d27);
      color: white;
      font-family: "Hiragino Mincho ProN", "Yu Mincho", serif;
      font-size: 1.55rem;
      box-shadow: inset 5px 0 0 rgba(255,255,255,.11),
                  0 7px 18px rgba(40,25,15,.22);
    }
    .meta { min-width: 0; }
    .category {
      margin: 0 0 3px;
      color: var(--accent);
      font-size: .78rem;
      font-weight: 700;
    }
    .book h2 {
      margin: 0;
      font-size: clamp(1.15rem, 4vw, 1.45rem);
      line-height: 1.4;
    }
    .arrow {
      color: var(--accent);
      font-size: 1.65rem;
      line-height: 1;
    }
    .description {
      margin: 16px 0 0;
      padding-top: 15px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: .93rem;
    }
    .empty {
      margin-top: 18px;
      padding: 18px 20px;
      border: 1px dashed var(--line);
      border-radius: 16px;
      color: var(--muted);
      font-size: .9rem;
    }
    footer {
      margin-top: 34px;
      padding-top: 20px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: .78rem;
      text-align: center;
    }
    @media (max-width: 480px) {
      .wrap { width: min(100% - 24px, 860px); }
      .book { padding: 18px; border-radius: 18px; }
      .book-top { grid-template-columns: 56px minmax(0,1fr) auto; gap: 13px; }
      .cover { width: 56px; height: 74px; }
    }
    @media print {
      body { background: #fff; color: #000; }
      .book { box-shadow: none; backdrop-filter: none; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <header>
      <p class="eyebrow">PERSONAL DIGITAL LIBRARY</p>
      <h1>GPT電子書庫</h1>
      <p class="lead">共同研究・論説・講演資料を、iPhone・iPad・パソコンから閲覧するための個人書庫です。</p>
    </header>

    <section aria-labelledby="recent-title">
      <h2 class="section-title" id="recent-title">収録論説</h2>

      <a class="book" href="第2部情報とは何か_固定ナビゲーション版.html">
        <div class="book-top">
          <div class="cover" aria-hidden="true">情</div>
          <div class="meta">
            <p class="category">情報論</p>
            <h2>第2部　情報とは何か</h2>
          </div>
          <span class="arrow" aria-hidden="true">›</span>
        </div>
        <p class="description">情報の本質を、区分・意味・生命・認知・社会という観点から考察する論説。</p>
      </a>

      <div class="empty">
        今後、新しい論説をHTML化するたびに、この本棚へ追加していきます。
      </div>
    </section>

    <footer>
      GPT電子書庫 Ver1
    </footer>
  </main>
</body>
</html>
